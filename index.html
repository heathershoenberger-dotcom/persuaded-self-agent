<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Headphone Decision Assistant — Research Activity</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#193044;background:#f3f6f9}*{box-sizing:border-box}body{margin:0;padding:12px}.app{max-width:760px;margin:auto;background:white;border:1px solid #dce5ec;border-radius:15px;overflow:hidden}.head{background:#173c51;color:white;padding:20px 23px}.head h1{margin:0;font-size:21px}.head p{margin:6px 0 0;font-size:13px;color:#dce8ef}.main{padding:22px;min-height:450px}.progress{font-size:12px;color:#536879;margin-bottom:16px}.bubble{background:#edf2f6;padding:13px 15px;border-radius:12px;line-height:1.55;margin:0 0 12px;max-width:95%}.bubble.me{background:#d9eee8;margin-left:auto;max-width:75%}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:9px;margin:15px 0}.button{cursor:pointer;border:1px solid #9eafbb;background:white;padding:12px;border-radius:9px;font:inherit;text-align:left}.button:hover,.button:focus-visible{outline:2px solid #14776d;outline-offset:1px}.primary{background:#126d67;color:white;border-color:#126d67;text-align:center;font-weight:650}.disclosure{padding:14px;background:#fff7e8;border:1px solid #dec38a;border-radius:9px;margin:14px 0;line-height:1.55}.products{display:grid;gap:9px;margin:14px 0}.product{border:1px solid #d6e1e9;border-radius:10px;padding:13px}.product h3{font-size:16px;margin:0 0 6px}.product p{font-size:13px;color:#475d6d;margin:5px 0}.note{font-size:13px;color:#52697b;line-height:1.5}.card{border:1px solid #d6e1e9;border-radius:9px;padding:13px;margin:12px 0}.done{background:#e6f5ed;border-radius:9px;padding:14px;margin:14px 0}.error{background:#fff1f1;color:#802e2e;padding:13px;border-radius:9px}.footer{border-top:1px solid #e5ebef;padding:13px 22px;color:#607181;font-size:12px}.input{width:100%;border:1px solid #9eafbb;border-radius:8px;padding:12px;font:inherit;margin:10px 0}.small{font-size:12px;color:#52697b}
</style></head><body><div class="app"><header class="head"><h1>Headphone Decision Assistant</h1><p>Interactive research activity</p></header><main class="main"><div class="progress" id="progress"></div><div id="chat" aria-live="polite"></div><div id="controls"></div></main><footer class="footer">Fictional brands and specifications · No actual purchase or payment</footer></div>
<script>
(()=>{'use strict';
const p=new URLSearchParams(location.search),role=p.get('role'),sponsor=p.get('sponsor'),pid=p.get('pid')||'',target=p.get('target')||'Auralis One';
const valid=['collab','functional'].includes(role)&&['yes','no'].includes(sponsor)&&['Auralis One','Vela Air','Noma Studio'].includes(target);
const collaborative=role==='collab',chat=document.getElementById('chat'),controls=document.getElementById('controls'),progress=document.getElementById('progress');
const products=[{name:'Auralis One',price:129,sound:'Balanced',comfort:'Plush ear pads',battery:'30 hours',description:'Balanced sound; plush ear pads; 30-hour battery; $129.'},{name:'Vela Air',price:129,sound:'Detailed',comfort:'Lightweight fit',battery:'28 hours',description:'Detailed sound; lightweight fit; 28-hour battery; $129.'},{name:'Noma Studio',price:129,sound:'Warm',comfort:'Cushioned fit',battery:'32 hours',description:'Warm sound; cushioned fit; 32-hour battery; $129.'}];
const questions=[{label:'Which feature matters most to you?',options:['Sound quality','Comfort','Battery life']},{label:'Where would you use headphones most?',options:['Work or study','Travel or commuting','Relaxing at home']},{label:'How do you prefer to weigh product trade-offs?',options:['Prioritize my top feature','Balance several features','Avoid major compromises']}];
let stage='baseline',answers=[],initial='',initialStrength='',selected='',finished=false,elaboration='';
function node(tag,cls,content){let e=document.createElement(tag);if(cls)e.className=cls;if(content!==undefined)e.textContent=content;return e}
function say(message,me=false){chat.append(node('div','bubble'+(me?' me':''),message));window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function buttons(options,fn){controls.replaceChildren();const wrap=node('div','options');options.forEach(label=>{const b=node('button','button',label);b.type='button';b.onclick=()=>fn(label);wrap.append(b)});controls.append(wrap)}
function setProgress(s){progress.textContent=s}
function showProducts(){const area=node('div','products');products.forEach(x=>{const c=node('div','product');c.append(node('h3','',x.name+' · $'+x.price));c.append(node('p','',x.description));area.append(c)});chat.append(area)}
function baseline(){setProgress('Part 1 of 4 · Initial impressions');say('Imagine you are considering a pair of headphones. All brands in this activity are fictional. Review the three options before receiving any assistance.');showProducts();say('Based only on this information, which option currently appeals to you most?');buttons(products.map(x=>x.name).concat(['No initial preference']),v=>{initial=v;say(v,true);baselineStrength()})}
function baselineStrength(){say('How certain are you about that initial preference?');buttons(['Not at all certain','Somewhat certain','Very certain'],v=>{initialStrength=v;say(v,true);startChat()})}
function startChat(){stage='chat';setProgress('Part 2 of 4 · Shopping assistant');say(collaborative?'We can explore your priorities together and work through the trade-offs as we go. I will ask a few questions to understand how you are thinking about this choice.':'The assistant will collect three preference inputs and compare them with the available product attributes.');ask(0)}
function ask(i){if(i>=questions.length){if(collaborative)elaborate();else recommend();return}const q=questions[i];say(collaborative?[`As you think about listening to music or podcasts, which feature would matter most to you?`,`That gives us a useful starting point. Where do you picture using the headphones most often?`,`We've identified a priority and a use case. How would you like us to think about trade-offs between features?`][i]:[`Input 1 of 3: Select the highest-priority attribute.`,`Input 2 of 3: Select the primary usage context.`,`Input 3 of 3: Select the trade-off rule.`][i]);buttons(q.options,v=>{answers.push(v);say(v,true);ask(i+1)})}
function elaborate(){say(`You prioritized ${answers[0].toLowerCase()} and mentioned ${answers[1].toLowerCase()}. When comparing products, what matters most about that priority for your own use?`);buttons(['Everyday convenience','Enjoyment and experience','Long-term practicality'],v=>{elaboration=v;say(v,true);recommend()})}
function recommend(){stage='recommendation';setProgress('Part 3 of 4 · Recommendation');
// Both arms receive identical recommendation facts. The collaborative arm includes a personal reflection question.
say(collaborative?`You identified ${answers[0].toLowerCase()} as a priority. Considering that alongside the other features, one option worth evaluating is ${target}. We can compare it against the alternatives before you decide.`:`Inputs recorded: priority=${answers[0]}; usage=${answers[1]}; trade-off rule=${answers[2]}. The recommended product is ${target}.`);
const disclosure=node('div','disclosure',sponsor==='yes'?`Advertising disclosure: ${target.split(' ')[0]} has paid this shopping service to promote ${target}. This commercial relationship may influence the recommendation.`:'Disclosure: No headphone manufacturer has paid this shopping service to promote a product in this recommendation.');chat.append(disclosure);
const recommended=products.find(x=>x.name===target);say(`Recommendation: ${target}. ${recommended.description}`);showProducts();
if(collaborative){say('As you consider this option alongside the others, which trade-off would you pay the most attention to?');buttons(['Sound and comfort','Comfort and battery','Sound and battery'],v=>{elaboration+=(elaboration?' | ':'')+v;say(v,true);finalChoice()})}
else{const b=node('button','button primary','Review products and choose');b.onclick=finalChoice;controls.replaceChildren(b)}
}
function finalChoice(){stage='choice';setProgress('Part 4 of 4 · Your decision');say(collaborative?'You have the final decision. You can select any product, including one other than the recommendation, or decide not to choose.':'Select the product you prefer, or select no product. The final decision is yours.');buttons(products.map(x=>x.name).concat(['I would not choose any of these']),v=>{selected=v;say(v,true);const c=node('div','card');c.append(node('strong','', 'Your selection: '+v));c.append(node('p','note','This is a simulated decision. No purchase will be made.'));const wrap=node('div','options');const back=node('button','button','Change selection');back.onclick=finalChoice;const done=node('button','button primary','Confirm selection');done.onclick=complete;wrap.append(back,done);controls.replaceChildren(c,wrap)})}
function complete(){if(finished)return;finished=true;stage='complete';setProgress('Activity complete');const code='PS3-'+Math.random().toString(36).slice(2,11).toUpperCase();const payload={type:'persuaded-self-complete',version:'3.0',role,sponsor,target,pid,initialPreference:initial,initialCertainty:initialStrength,answers,elaboration,selected,acceptedRecommendation:selected===target,code};controls.replaceChildren(node('div','done','Your decision has been recorded for this activity. Continue to the next survey page to answer questions about your experience.'));controls.append(node('p','small','Completion code: '+code));const copy=node('button','button','Copy completion code');copy.onclick=()=>navigator.clipboard?.writeText(code);controls.append(copy);
// Origin is verified by the Qualtrics receiver, and no identifying information is sent.
try{window.parent.postMessage(payload,'*')}catch(e){}
try{sessionStorage.setItem('ps-agent-last',JSON.stringify(payload))}catch(e){}
}
if(!valid){controls.append(node('div','error','This study link is missing an experimental assignment. Add ?role=collab&sponsor=yes (or role=functional and/or sponsor=no).'));return}baseline();
})();
</script></body></html>
