<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Decision Assistant</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#1c2936;background:#f5f7fa}*{box-sizing:border-box}body{margin:0;padding:12px}.app{max-width:740px;margin:auto;background:#fff;border:1px solid #dbe3ea;border-radius:16px;overflow:hidden}.head{background:#17354a;color:white;padding:20px 23px}.head h1{font-size:21px;margin:0}.head p{font-size:13px;margin:6px 0 0;color:#d9e5ed}.body{padding:20px 22px;min-height:380px}.bubble{max-width:91%;padding:12px 15px;margin:0 0 12px;border-radius:13px;background:#edf2f6;line-height:1.5}.bubble.me{margin-left:auto;background:#d9efe9}.prompt{font-size:14px;color:#536577}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin:13px 0 20px}button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid #9eacb9;background:#fff;padding:11px;text-align:left}button:hover,button:focus{border-color:#116b69;background:#edf8f5}button.primary{background:#116b69;border-color:#116b69;color:white;text-align:center;font-weight:600}.disclosure{background:#fff7e9;border:1px solid #e1c68c;border-radius:9px;padding:12px 14px;margin:14px 0;font-size:14px}.product{border:1px solid #dbe3ea;border-radius:10px;padding:14px;margin:10px 0}.product h3{margin:0 0 6px;font-size:16px}.product p{font-size:13px;margin:5px 0;color:#465a6a}.selected{border:2px solid #116b69}.status{padding:13px;border-radius:9px;background:#eaf5ef;margin:12px 0}.footer{border-top:1px solid #e7edf2;padding:12px 22px;color:#697988;font-size:12px}.muted{color:#526577;font-size:13px}.hide{display:none}.error{color:#842e28;background:#fff1ef;padding:14px;border-radius:9px}.topline{font-size:12px;color:#526577;margin-bottom:14px}a{color:#086c7c}.summary{border:1px solid #d7e1e7;border-radius:9px;padding:12px;margin:14px 0}
</style></head><body><div class="app"><div class="head"><h1 id="title">Product Decision Assistant</h1><p>Headphone selection activity</p></div><div class="body"><div class="topline" id="progress">Decision exercise</div><div id="chat" aria-live="polite"></div><div id="control"></div></div><div class="footer">Research interaction • Product names and specifications are fictional • No payment is collected</div></div><script>
(()=>{'use strict';const p=new URLSearchParams(location.search),role=p.get('role'),choice=p.get('choice'),sponsor=p.get('sponsor')||'yes',pid=p.get('pid')||'',returnUrl=p.get('return')||'';const valid=['collab','functional'].includes(role)&&['active','assigned'].includes(choice)&&['yes','no'].includes(sponsor);const collab=role==='collab';const chat=document.getElementById('chat'),ctrl=document.getElementById('control'),prog=document.getElementById('progress');let step=0,answers=[],chosen='',completed=false;document.getElementById('title').textContent=collab?'Your Shopping Partner':'Product Comparison Assistant';const questions=[{q:'Which headphone feature matters most to you?',opts:['Sound quality','Comfort','Battery life','Price']},{q:'Where would you use headphones most often?',opts:['Work or study','Travel or commuting','Exercise','Relaxing at home']},{q:'Which budget range best fits your needs?',opts:['Under $100','$100–$150','$151–$200','Over $200']}];const products=[{id:'Auralis One',price:'$129',description:'Balanced sound; 30-hour battery; cushioned ear pads; lightweight design.'},{id:'Vela Air',price:'$119',description:'Detailed sound; 26-hour battery; cushioned ear pads; lightweight design.'},{id:'Noma Studio',price:'$139',description:'Warm sound; 32-hour battery; cushioned ear pads; lightweight design.'}];function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}function bubble(s,me=false){chat.append(el('div','bubble'+(me?' me':''),s));}function addButtons(options,cb){ctrl.replaceChildren();const wrap=el('div','choices');options.forEach(x=>{let b=el('button','',x);b.type='button';b.addEventListener('click',()=>cb(x));wrap.append(b)});ctrl.append(wrap)}function question(){prog.textContent='Step '+(step+1)+' of 5';if(step===0)bubble(collab?"Let's work through this together. Your preferences will guide the conversation, and we'll consider what seems right for you.":'Enter product preferences. The system will compare available product specifications against the entered criteria.');bubble(collab?['When you picture using headphones, which feature feels most important to you?','That helps us understand your priorities. Where do you imagine using them most?','One more thing: what spending range would feel comfortable to you?'][step]:['Select the highest-priority product attribute.','Select the primary intended usage context.','Select the budget range.'][step]);const q=questions[step];ctrl.append(el('div','prompt',q.q));addButtons(q.opts,v=>{bubble(v,true);answers.push(v);step++;if(step<3)question();else recommend()})}function recommend(){prog.textContent='Step 4 of 5 • Recommendation';bubble(collab?`We've considered ${answers[0].toLowerCase()}, ${answers[1].toLowerCase()}, and your budget of ${answers[2]}. Let's review an option together. We can still decide whether it fits your needs.`:`Inputs recorded: priority=${answers[0]}; usage=${answers[1]}; budget=${answers[2]}. Product recommendation follows.`);const d=el('div','disclosure',sponsor==='yes'?'Advertising disclosure: Auralis has paid this shopping service to promote Auralis One. This commercial relationship may influence the recommendation.':'Disclosure: No headphone manufacturer has paid this shopping service to promote a product in this recommendation.');chat.append(d);bubble('Recommended product: Auralis One. Balanced sound, 30-hour battery life, cushioned ear pads, and a lightweight design. Price: $129.');const listing=el('div','summary');listing.append(el('strong','', 'Available products'));products.forEach(x=>{const line=el('div','product');line.append(el('h3','',x.id+' — '+x.price));line.append(el('p','',x.description));listing.append(line)});chat.append(listing);const btn=el('button','primary','Continue to selection');btn.type='button';ctrl.replaceChildren(btn);btn.onclick=selection}function selection(){prog.textContent='Step 5 of 5 • Final selection';ctrl.replaceChildren();if(choice==='active'){bubble(collab?'You have the final say. Which product would you like to select? It is completely fine to choose something other than my recommendation.':'Select one product. You may accept or reject the recommended option.');addButtons(products.map(x=>x.id),v=>{chosen=v;const confirm=el('div','summary');confirm.append(el('strong','', 'Your selection: '+v));confirm.append(el('p','muted','You may change this selection before confirming.'));const row=el('div','choices');const change=el('button','','Change selection');change.onclick=selection;const submit=el('button','primary','Confirm my selection');submit.onclick=()=>complete();row.append(change,submit);ctrl.replaceChildren(confirm,row)})}else{chosen='Auralis One';bubble(collab?"For this exercise, I'll make the final selection based on the recommendation we reviewed together.":'The system has made the final selection based on the recommendation.');const line=el('div','status','System-selected product: Auralis One');ctrl.append(line);const btn=el('button','primary','Continue');btn.onclick=complete;ctrl.append(btn)}}function complete(){if(completed)return;completed=true;prog.textContent='Interaction complete';ctrl.replaceChildren();const code='PS2-'+role+'-'+choice+'-'+(sponsor==='yes'?'S':'I')+'-'+Math.random().toString(36).slice(2,10).toUpperCase();const result={type:'persuaded-self-complete',version:'2.0',role,choice,sponsor,pid,answers,selected:chosen,acceptedRecommendation:chosen==='Auralis One',code};const box=el('div','status','Thank you. Your selection has been recorded for this activity. Please continue with the survey.');ctrl.append(box);const c=el('p','muted','Completion code: '+code);ctrl.append(c);const copy=el('button','','Copy completion code');copy.onclick=()=>{if(navigator.clipboard)navigator.clipboard.writeText(code)};ctrl.append(copy);if(returnUrl){try{const url=new URL(returnUrl);if(url.protocol==='https:'){url.searchParams.set('agent_complete','1');url.searchParams.set('agent_code',code);url.searchParams.set('agent_choice',chosen);const a=el('a','','Return to survey');a.href=url.toString();a.style.display='block';a.style.marginTop='14px';ctrl.append(a)}}catch(e){}}try{window.parent.postMessage(result,'*')}catch(e){}try{sessionStorage.setItem('ps-agent-last',JSON.stringify(result))}catch(e){}}if(!valid){ctrl.append(el('div','error','Experimental assignment is missing. Provide ?role=collab&choice=active (or role=functional, choice=assigned). Optional: sponsor=yes or no.'));return}question();})();
</script></body></html>
