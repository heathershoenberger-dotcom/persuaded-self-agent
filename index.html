 state.eligibleContrast=aligned!=='auralis'&&state.primaryPriority!=='No clear preference'&&state.primaryPriority!=='Multiple priorities';
 const p=PRODUCTS.find(x=>x.id===rec),best=PRODUCTS.find(x=>x.id===aligned);
 const priority=preferencePhrase(state.answers[0]||'No clear preference'),use=preferencePhrase(state.answers[1]||'No clear preference');
 if(collaborative)bubble(`You've helped narrow down what matters: ${priority}, particularly for ${use}. I want to check the recommendation against those priorities, rather than assume my suggestion is the only sensible choice.`);
 else bubble(`The comparison uses the recorded primary criterion (${priority}) and intended use (${use}). Review the recommendation against the listed specifications.`);
 if(rec!==aligned){
  bubble(collaborative?`I want to be clear about the trade-off: ${best.name} has the stronger match on the priority you mentioned. I'm suggesting ${p.name} for consideration, but I don't want that difference to get lost. What do you think?`:`${p.name} is the recommendation. ${best.name} may be a closer match on the stated primary criterion. Review the product specifications before choosing.`);
 }else{
  bubble(collaborative?`Using your priority as our starting point, ${p.name} looks like the closest match under the comparison rule. Let's check whether that holds up for you.`:`The predefined priority rule selects ${p.name}.`);
 }
 bubble(`Recommendation: ${recommendationText(p)}`);cards();
 bubble(collaborative?'Which comparison would help us evaluate the suggestion? We can check the evidence and revise our view if needed.':'Choose a feature comparison to review the evidence.');
 optionPrompt('Choose a comparison dimension:',['Sound and comfort','Comfort and battery','Sound and battery'],v=>{state.comparison=v;showComparison(v);discussRecommendation()});
}

function showComparison(dimension){
 const focus=STUDY==='study1'?(dimension==='Sound and comfort'?['a','b']:dimension==='Comfort and battery'?['b','c']:['a','c']):(dimension==='Daily convenience'?['a','b']:dimension==='Insulation and capacity'?['b','c']:['a','c']);
 const labels=STUDY==='study1'?{a:'Sound',b:'Comfort',c:'Battery'}:{a:'Feature 1',b:'Feature 2',c:'Feature 3'};
 const lines=PRODUCTS.map(p=>p.name+': '+focus.map(k=>labels[k]+' — '+p[k]).join('; '));
 panel('Comparison: '+dimension+'\n'+lines.join('\n'));
}
function discussRecommendation(){
 bubble(collaborative?'Now that we have compared the details, is there anything you would like to challenge or check about my suggestion? You do not have to agree with it.':'You may review the recommendation before choosing. Select a question or continue.');
 optionPrompt('What would you like to do?',['Why this product?','What might be a drawback?','I am ready to choose'],v=>{
  state.recommendationQuestion=v;
  const p=PRODUCTS.find(x=>x.id===state.recommendedTarget);
  if(v==='Why this product?'){
   bubble(collaborative?`That's worth asking. ${p.name} is one option to consider based on the features shown, but the specifications don't establish that it is the best fit for you. Your priorities and the trade-offs still matter.`:`${p.name} is the recommendation. Its listed specifications are ${p.a.toLowerCase()}, ${p.b.toLowerCase()}, and ${p.c.toLowerCase()}. The available specifications do not establish a uniquely best choice.`);
  }else if(v==='What might be a drawback?'){
   bubble(collaborative?`A fair challenge. ${p.name} will not lead on every feature. Looking at the comparison, you may prefer a different model depending on which feature matters most. We can disagree with the suggestion and still make a useful choice.`:`The three products have different specifications. ${p.name} is not superior on every dimension; compare the displayed features to identify possible trade-offs.`);
  }else{
   bubble(collaborative?'That works. You have enough information to make your own call.':'Proceed to final selection.');
  }
  choice();
 });
}
function choice(){setStep(4);bubble(collaborative?'You have the final say. Which option would you choose for yourself? It is also fine to choose none.':'Which option would you choose? You can also decide none is right for you.');optionPrompt('Which would you choose?',PRODUCTS.map(x=>x.name).concat(['I would choose none of these']),v=>{state.selected=v;state.accepted=PRODUCTS.find(x=>x.id===state.recommendedTarget).name===v;panel(`Your selection: ${v}. This is a research simulation. Nothing will be purchased.`);button('Confirm my selection',finish)})}
function finish(){state.completedAt=new Date().toISOString();state.completionCode='HAART-'+Math.random().toString(36).slice(2,10).toUpperCase();setStep(4);controls.replaceChildren();panel('Activity complete. Please continue to the survey questions.');const c=$('p','muted',`Completion code: ${state.completionCode}`);controls.append(c);const copy=$('button','btn','Copy completion code');copy.onclick=()=>navigator.clipboard?.writeText(state.completionCode);controls.append(copy);try{sessionStorage.setItem('haart-last-'+STUDY,JSON.stringify(state))}catch(e){}try{window.parent.postMessage({type:'haart-agent-complete',payload:state},'*')}catch(e){}if(preview){const out=$('details','');out.append($('summary','','Preview: show recorded responses'));const pre=$('pre','');pre.style.whiteSpace='pre-wrap';pre.textContent=JSON.stringify(state,null,2);out.append(pre);controls.append(out)}}
if(!validRole||!validOther||!validTarget){panel('This link needs role=collab or functional and bias=aligned or favored.','error');return}
meta.textContent='Headphone shopping · Research simulation';const disclosure=$('div','sponsor-note','AI Agent · Sponsored by Auralis One');document.querySelector('.top').after(disclosure);start();
})();
